
  <!DOCTYPE html>
  <html lang="en">
    <head>
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <title>Dreamland</title>
      <link rel="icon" type="image/png" href="/icon-192.png" />
      <link rel="apple-touch-icon" href="/icon-192.png" />
      <link rel="manifest" href="/manifest.json" />
      <link rel="preload" as="image" href="/logo.jpg" />
      <link rel="preconnect" href="https://fonts.googleapis.com" />
      <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
      <meta name="theme-color" content="#6366f1" />
      <meta name="mobile-web-app-capable" content="yes" />
      <meta name="apple-mobile-web-app-capable" content="yes" />
      <meta name="apple-mobile-web-app-status-bar-style" content="default" />
      <meta name="apple-mobile-web-app-title" content="Dreamland" />
        <style>
          body { background-color: #111827; margin: 0; }
          .initial-loader {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            width: 100vw;
            background: linear-gradient(to bottom right, #3b0764, #be185d, #1e3a8a);
            color: white;
            font-family: system-ui, -apple-system, sans-serif;
          }
          .loader-logo {
            width: 120px;
            height: 120px;
            border-radius: 24px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            margin-bottom: 24px;
            object-fit: cover;
          }
          .loader-spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s ease-in-out infinite;
          }
          @keyframes spin {
            to { transform: rotate(360deg); }
          }
        </style>
      </head>
    
      <body>
        <div id="root">
          <div class="initial-loader">
            <img src="/logo.jpg" alt="Dreamland" class="loader-logo" />
            <div class="loader-spinner"></div>
          </div>
        </div>
        <script type="module" src="/src/main.tsx"></script>
      </body>  </html>
